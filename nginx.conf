server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API requests to the backend running on the host (inside Docker this
  # resolves to the host machine via the extra_hosts entry in docker-compose).
  # This makes API calls same-origin from the browser and avoids CORS issues.
  location ~* ^/(auth|materias|recordatorios|convenios|talentotech|recursos)(/.*)?$ {
    proxy_pass http://host.docker.internal:8000$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
